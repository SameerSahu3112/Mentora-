[alembic]

# path to migration scripts
script_location = migrations

# database URL (overridden by env at runtime)
sqlalchemy.url = postgresql+asyncpg://mentora:mentora@localhost:5432/mentora

# version location
version_locations = %(here)s/migrations/versions

# template for new migrations
file_template = %%(rev)s_%%(slug)s

# timezone
timezone = utc

[post_write_hooks]

# hook to run black on new migration scripts
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 79 %(version)s %(head)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
