# Mentora Nginx Configuration
# Phase 10: Deployment
# Brand: Abyss Teal + Desert Sand
#
# This Nginx config provides unified routing for frontend and backend.
# Note: On Render free tier, Render's built-in routing already handles
# public services, so an always-on Nginx service is NOT required.
# Use this config for local development or a future unified deployment.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout   65;

    # Upstream backends
    upstream mentora_frontend {
        server frontend:3000;
    }

    upstream mentora_backend {
        server backend:8000;
    }

    # Frontend server (port 80)
    server {
        listen 80;
        server_name localhost mentora.example.com;

        # Health check
        location /health {
            proxy_pass http://mentora_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes → Backend
        location /api/ {
            proxy_pass http://mentora_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header Access-Control-Max-Age 1728000 always;
                add_header Content-Type 'text/plain; charset=utf-8' always;
                add_header Content-Length 0 always;
                return 204;
            }
        }

        # Static files → Frontend (Next.js)
        location /_next/ {
            proxy_pass http://mentora_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other routes → Frontend (SPA routing)
        location / {
            proxy_pass http://mentora_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend direct access (for debugging, port 8001)
    server {
        listen 8001;
        server_name localhost;

        location / {
            proxy_pass http://mentora_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
