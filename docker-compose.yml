# Mentora Docker Compose
# Phase 10: Project Foundation + Deployment

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mentora

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mentora:mentora@db:5432/mentora
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mentora

  frontend:
    build: ./frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    depends_on:
      - backend
    networks:
      - mentora

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mentora
      POSTGRES_PASSWORD: mentora
      POSTGRES_DB: mentora
    ports:
      - "5432:5432"
    volumes:
      - mentora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentora -d mentora"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mentora

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mentora

networks:
  mentora:

volumes:
  mentora_postgres_data:
